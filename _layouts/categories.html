---
layout: default
title: Categories
---

<h1>Categories</h1>

<ul>
  {% for category in site.categories %}
    <li>
        {{ category[0] | capitalize }}
    </li>
    <ul>
    {% assign name = category[0] | downcase %}
    {% for post in site.categories[name] %}
      <li><a href="{{ post.url }}">{{ post.title }}</a></li>
    {% endfor %}
    </ul>
  {% endfor %}
</ul>
